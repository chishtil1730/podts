<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>GLB Model Test</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#1a1a1a; color:#fff; font-family:monospace; display:flex; flex-direction:column; height:100vh; }
        #log {
            background:#0d0d0d; border-bottom:1px solid #333;
            padding:0.75rem 1rem; font-size:0.72rem; line-height:1.8;
            max-height:160px; overflow-y:auto; flex-shrink:0;
        }
        .log-ok   { color:#4ade80; }
        .log-warn { color:#facc15; }
        .log-err  { color:#f87171; }
        .log-info { color:#94a3b8; }
        #canvas-wrap { flex:1; position:relative; }
        canvas { width:100%!important; height:100%!important; display:block; }
        #drop-hint {
            position:absolute; inset:0; display:flex; align-items:center;
            justify-content:center; flex-direction:column; gap:1rem;
            pointer-events:none;
        }
        #drop-hint p { color:#555; font-size:0.8rem; text-align:center; }
        #file-btn {
            pointer-events:all; cursor:pointer;
            background:#333; border:1.5px solid #555; color:#ccc;
            padding:0.6rem 1.4rem; border-radius:8px; font-family:monospace;
            font-size:0.8rem; transition:border-color 0.2s;
        }
        #file-btn:hover { border-color:#aaa; color:#fff; }
        #info-box {
            position:absolute; bottom:1rem; left:1rem;
            background:rgba(0,0,0,0.7); border:1px solid #333;
            padding:0.6rem 0.9rem; border-radius:8px;
            font-size:0.68rem; line-height:1.9; color:#94a3b8;
            pointer-events:none;
        }
    </style>
</head>
<body>

<div id="log"><span class="log-info">▸ Waiting for model…</span></div>

<div id="canvas-wrap">
    <div id="drop-hint">
        <button id="file-btn" onclick="document.getElementById('file-input').click()">
            ↑ Load .glb / .gltf / .obj
        </button>
        <p>or drag &amp; drop a file here</p>
    </div>
    <div id="info-box" style="display:none"></div>
</div>

<input type="file" id="file-input" accept=".glb,.gltf,.obj" style="display:none"
       onchange="loadFile(this.files[0])"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    /* ── LOGGING ─────────────────────────────────────────────── */
    const logEl = document.getElementById('log');
    function log(msg, type) {
        const span = document.createElement('span');
        span.className = 'log-' + (type || 'info');
        span.textContent = '▸ ' + msg;
        logEl.appendChild(document.createElement('br'));
        logEl.appendChild(span);
        logEl.scrollTop = logEl.scrollHeight;
    }

    /* ── SCENE ───────────────────────────────────────────────── */
    const wrap   = document.getElementById('canvas-wrap');
    const W = () => wrap.clientWidth;
    const H = () => wrap.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W(), H());
    renderer.setClearColor(0x1a1a1a);
    wrap.appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, W()/H(), 0.001, 10000);
    camera.position.set(0, 0, 3);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(3, 5, 4); scene.add(key);
    const fill = new THREE.DirectionalLight(0xfff0e0, 0.5);
    fill.position.set(-3, 1, 2); scene.add(fill);

    // Grid helper for orientation
    const grid = new THREE.GridHelper(4, 10, 0x333333, 0x222222);
    scene.add(grid);

    /* ── ORBIT (simple drag) ──────────────────────────────────── */
    let isDrag = false, prevM = {x:0,y:0};
    let rotY = 0.4, rotX = 0.1;
    let modelGroup = null;

    renderer.domElement.addEventListener('mousedown', e => { isDrag=true; prevM={x:e.clientX,y:e.clientY}; });
    window.addEventListener('mousemove', e => {
        if (!isDrag) return;
        rotY += (e.clientX - prevM.x) * 0.012;
        rotX += (e.clientY - prevM.y) * 0.009;
        prevM = {x:e.clientX,y:e.clientY};
    });
    window.addEventListener('mouseup', () => isDrag=false);
    renderer.domElement.addEventListener('wheel', e => {
        camera.position.z = Math.max(0.1, Math.min(20, camera.position.z + e.deltaY * 0.005));
    }, {passive:true});

    /* ── RENDER LOOP ─────────────────────────────────────────── */
    (function loop() {
        requestAnimationFrame(loop);
        if (modelGroup) { modelGroup.rotation.y = rotY; modelGroup.rotation.x = rotX; }
        renderer.render(scene, camera);
    })();

    new ResizeObserver(() => {
        camera.aspect = W()/H(); camera.updateProjectionMatrix();
        renderer.setSize(W(), H());
    }).observe(wrap);

    /* ── FIT MODEL ───────────────────────────────────────────── */
    function fitModel(obj) {
        const box  = new THREE.Box3().setFromObject(obj);
        const size = box.getSize(new THREE.Vector3());
        const max  = Math.max(size.x, size.y, size.z);

        log('Raw size: ' + size.x.toFixed(3) + ' × ' + size.y.toFixed(3) + ' × ' + size.z.toFixed(3), 'info');

        if (max === 0) { log('⚠ Model has ZERO size — no geometry exported!', 'err'); return; }

        const scale = 2.0 / max;
        obj.scale.setScalar(scale);
        obj.updateMatrixWorld(true);

        const box2   = new THREE.Box3().setFromObject(obj);
        const centre = box2.getCenter(new THREE.Vector3());
        obj.position.set(-centre.x, -centre.y, -centre.z);

        // Set camera back to fit
        const fitted = box2.getSize(new THREE.Vector3());
        camera.position.z = Math.max(fitted.z / 2 + 1.5, 2.5);

        log('Scale applied: ' + scale.toFixed(5), 'ok');
        log('Camera Z set to: ' + camera.position.z.toFixed(2), 'info');

        // Info box
        const info = document.getElementById('info-box');
        info.style.display = 'block';
        info.innerHTML =
            'Raw size: ' + size.x.toFixed(2) + ' × ' + size.y.toFixed(2) + ' × ' + size.z.toFixed(2) + '<br>' +
            'Scale:    ' + scale.toFixed(5) + '<br>' +
            'Camera Z: ' + camera.position.z.toFixed(2);
    }

    /* ── LOAD FILE ───────────────────────────────────────────── */
    function loadFile(file) {
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        log('Loading: ' + file.name + ' (' + (file.size/1024).toFixed(1) + ' KB)', 'info');

        document.getElementById('drop-hint').style.display = 'none';

        const reader = new FileReader();
        reader.onload = e => {
            const blob = new Blob([e.target.result]);
            const url  = URL.createObjectURL(blob);

            if (ext === 'glb' || ext === 'gltf') loadGLTF(url, file.name);
            else if (ext === 'obj') loadOBJ(url, file.name);
            else log('Unsupported format: .' + ext, 'err');
        };
        reader.readAsArrayBuffer(file);
    }

    function addModel(obj, name) {
        if (modelGroup) scene.remove(modelGroup);
        modelGroup = obj;
        fitModel(obj);
        scene.add(obj);

        let meshCount = 0, triCount = 0;
        obj.traverse(child => {
            if (!child.isMesh) return;
            meshCount++;
            if (child.geometry.index) triCount += child.geometry.index.count / 3;
            else triCount += child.geometry.attributes.position.count / 3;
            log('Mesh: "' + (child.name||'unnamed') + '" — visible:' + child.visible
                + ' material:' + (child.material.type||'?'), 'info');
        });

        if (meshCount === 0) {
            log('⚠ NO MESHES FOUND — model may be empty or only contain armatures/bones', 'err');
            log('  → In Blender: make sure mesh objects are included in export', 'warn');
        } else {
            log('✓ Loaded! Meshes: ' + meshCount + ' | ~' + Math.round(triCount) + ' triangles', 'ok');
        }
    }

    function loadGLTF(url, name) {
        function go() {
            const loader = new THREE.GLTFLoader();
            loader.load(url, gltf => {
                URL.revokeObjectURL(url);
                log('GLTF parsed OK — scene children: ' + gltf.scene.children.length, 'ok');
                addModel(gltf.scene, name);
            }, xhr => {
                if (xhr.total > 0) log('Progress: ' + Math.round(xhr.loaded/xhr.total*100) + '%', 'info');
            }, err => {
                URL.revokeObjectURL(url);
                log('GLTF ERROR: ' + (err.message || err), 'err');
            });
        }

        if (window.THREE.GLTFLoader) { go(); return; }
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
        s.onload = go;
        document.head.appendChild(s);
    }

    function loadOBJ(url, name) {
        function go() {
            const loader = new THREE.OBJLoader();
            loader.load(url, obj => {
                URL.revokeObjectURL(url);
                log('OBJ parsed OK', 'ok');
                addModel(obj, name);
            }, null, err => {
                URL.revokeObjectURL(url);
                log('OBJ ERROR: ' + (err.message || err), 'err');
            });
        }

        if (window.THREE.OBJLoader) { go(); return; }
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js';
        s.onload = go;
        document.head.appendChild(s);
    }

    /* ── DRAG & DROP ─────────────────────────────────────────── */
    document.body.addEventListener('dragover', e => e.preventDefault());
    document.body.addEventListener('drop', e => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) loadFile(file);
    });
</script>
</body>
</html>
